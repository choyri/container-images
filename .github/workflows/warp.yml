name: warp

on:
  push:
    branches: [master]
    paths:
      - warp/**
      - .github/workflows/warp.yml
  pull_request:
    paths:
      - warp/**
      - .github/workflows/warp.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read   # fetch the repository content
      packages: write  # push to ghcr.io with GITHUB_TOKEN
      id-token: write  # sign provenance and GitHub Actions cache entries
    with:
      job-name-prefix: warp
      context: ./warp
      output: image
      push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: warp-2026.10.0
      build-args: |
        MESH_VERSION=2026.10.0
        THREEPROXY_VERSION=1.0.3
      set-meta-labels: true
      set-meta-annotations: true
      # Requires the DOCKERHUB_USERNAME repository variable. Drop the docker.io
      # line (and its registry-auths entry) to publish to GHCR only.
      meta-images: |
        docker.io/${{ vars.DOCKERHUB_USERNAME }}/warp
        ghcr.io/${{ github.repository_owner }}/warp
      meta-flavor: |
        latest=false
      meta-tags: |
        type=raw,value=2026.10.0
        type=raw,value=latest
      # metadata-action already derives source/url/revision/created from the repo.
      # These three are overridden because its defaults are repo-level and this is
      # one image among several. Mirrored into annotations because GHCR reads the
      # manifest annotations, not the config labels, for a multi-arch package page.
      meta-labels: |
        org.opencontainers.image.title=warp
        org.opencontainers.image.description=Cloudflare WARP with HTTP and SOCKS5 proxies powered by 3proxy
        org.opencontainers.image.version=2026.10.0
      meta-annotations: |
        org.opencontainers.image.title=warp
        org.opencontainers.image.description=Cloudflare WARP with HTTP and SOCKS5 proxies powered by 3proxy
        org.opencontainers.image.version=2026.10.0
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # Test the published binary without registering a WARP device in CI.
  smoke-test:
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start 3proxy
        run: |
          docker network create warp-smoke
          docker run -d --name warp-smoke --network warp-smoke \
            --no-healthcheck --entrypoint /usr/local/bin/3proxy \
            "ghcr.io/${{ github.repository_owner }}/warp@${{ needs.build.outputs.digest }}" /etc/3proxy/3proxy.cfg

      - name: Test HTTP and SOCKS5 proxies
        run: |
          docker run --rm --network warp-smoke \
            --mount "type=bind,source=$PWD/warp/smoke-test.py,target=/smoke-test.py,readonly" \
            python:3.15-alpine python /smoke-test.py warp-smoke

      - name: Show proxy logs on failure
        if: failure()
        run: |
          docker logs warp-smoke || true

name: opensearch-ik

on:
  push:
    branches: [master]
    paths:
      - opensearch-ik/**
      - .github/workflows/opensearch-ik.yml
  pull_request:
    paths:
      - opensearch-ik/**
      - .github/workflows/opensearch-ik.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Read OpenSearch version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^ARG OPENSEARCH_VERSION=//p' opensearch-ik/Dockerfile)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Expected one OPENSEARCH_VERSION=x.y.z default in opensearch-ik/Dockerfile'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read   # fetch the repository content
      packages: write  # push to ghcr.io with GITHUB_TOKEN
      id-token: write  # sign provenance and GitHub Actions cache entries
    with:
      job-name-prefix: ${{ needs.prepare.outputs.version }}
      context: ./opensearch-ik
      output: image
      push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: opensearch-ik-${{ needs.prepare.outputs.version }}
      set-meta-labels: true
      set-meta-annotations: true
      # Requires the DOCKERHUB_USERNAME repository variable. Drop the docker.io
      # line (and its registry-auths entry) to publish to GHCR only.
      meta-images: |
        docker.io/${{ vars.DOCKERHUB_USERNAME }}/opensearch-ik
        ghcr.io/${{ github.repository_owner }}/opensearch-ik
      meta-flavor: |
        latest=false
      meta-tags: |
        type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
        type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
        type=semver,pattern={{major}},value=${{ needs.prepare.outputs.version }}
        type=raw,value=latest
      # metadata-action already derives source/url/revision/created from the repo.
      # These three are overridden because its defaults are repo-level and this is
      # one image among several. Mirrored into annotations because GHCR reads the
      # manifest annotations, not the config labels, for a multi-arch package page.
      meta-labels: |
        org.opencontainers.image.title=opensearch-ik
        org.opencontainers.image.description=OpenSearch ${{ needs.prepare.outputs.version }} with the INFINI analysis-ik plugin preinstalled
        org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      meta-annotations: |
        org.opencontainers.image.title=opensearch-ik
        org.opencontainers.image.description=OpenSearch ${{ needs.prepare.outputs.version }} with the INFINI analysis-ik plugin preinstalled
        org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # Verifies the published image really starts and loads the plugin. Runs after
  # the push, so a failure here means "pull the tag", not "the tag never landed".
  smoke-test:
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start OpenSearch
        run: |
          docker run -d --name opensearch-ik -p 9200:9200 \
            -e discovery.type=single-node \
            -e DISABLE_SECURITY_PLUGIN=true \
            -e OPENSEARCH_JAVA_OPTS='-Xms1g -Xmx1g' \
            "ghcr.io/${{ github.repository_owner }}/opensearch-ik@${{ needs.build.outputs.digest }}"

      - name: Wait for the node to answer
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:9200 >/dev/null; then exit 0; fi
            sleep 5
          done
          echo "node did not come up" >&2
          docker logs opensearch-ik >&2
          exit 1

      - name: Assert analysis-ik is loaded
        run: curl -fsS 'http://localhost:9200/_cat/plugins?v' | tee /dev/stderr | grep -q analysis-ik

      - name: Assert ik_smart tokenizes Chinese
        run: |
          curl -fsS -X POST http://localhost:9200/_analyze \
            -H 'Content-Type: application/json' \
            -d '{"analyzer":"ik_smart","text":"计算机汉字输入方法"}' \
            | tee /dev/stderr | grep -q '"计算机"'
